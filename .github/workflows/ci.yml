name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build --tag jobtracker:ci .

      - name: Start the container
        run: docker run --detach --name jobtracker --publish 8080:8080 jobtracker:ci

      - name: Check the home page responds
        run: curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8080/ > /dev/null

      - name: Check an unknown page returns the friendly 404
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/does-not-exist)
          echo "Status: $status"
          test "$status" = "404"

      - name: Show container logs if something failed
        if: failure()
        run: docker logs jobtracker
